<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d"><title id="t">Δύο σύνολα και κοινά στοιχεία</title><desc id="d">Α μόνο: 1. Κοινή περιοχή Α και Β: 2. Β μόνο: 3.</desc><rect width="600" height="300" rx="14" fill="white"/><g font-family="Arial,sans-serif" fill="#16324f"><text x="300" y="30" text-anchor="middle" font-size="20">Α={1,2}, Β={2,3}</text><circle cx="240" cy="160" r="92" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><circle cx="360" cy="160" r="92" fill="#fecaca" fill-opacity="0.65" stroke="#b91c1c" stroke-width="3"/><g font-size="27" text-anchor="middle"><text x="195" y="110" fill="#1d4ed8">Α</text><text x="405" y="110" fill="#b91c1c">Β</text><text x="215" y="170">1</text><text x="300" y="170">2</text><text x="385" y="170">3</text></g><text x="300" y="284" text-anchor="middle" font-size="15">Η τομή περιέχει τα στοιχεία της κοινής περιοχής.</text></g></svg>
