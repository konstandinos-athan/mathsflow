<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d"><title id="t">Παράλληλη σε πλευρά τριγώνου</title><desc id="d">Δ στο ΑΒ και Ε στο ΑΓ, με ΔΕ παράλληλη στη ΒΓ. ΑΔ 3 cm, ΔΒ 3 cm, ΑΕ 5 cm.</desc><rect width="600" height="300" rx="14" fill="white"/><g font-family="Arial,sans-serif" fill="#16324f"><text x="300" y="28" text-anchor="middle" font-size="20">ΔΕ ∥ ΒΓ</text><path d="M170 55V235H410Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/><path d="M170 145H290" fill="none" stroke="#b45309" stroke-width="3"/><g font-size="19"><text x="146" y="50">Α</text><text x="146" y="258">Β</text><text x="420" y="258">Γ</text><text x="145" y="152">Δ</text><text x="295" y="139">Ε</text><text x="100" y="106">3 cm</text><text x="100" y="198">3 cm</text><text x="239" y="83">5 cm</text><text x="363" y="174">?</text></g><text x="300" y="284" text-anchor="middle" font-size="14">Τα σημεία Δ και Ε ανήκουν στις πλευρές του τριγώνου.</text></g></svg>
