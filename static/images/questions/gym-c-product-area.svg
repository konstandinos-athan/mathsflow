<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d"><title id="t">Γινόμενο ως εμβαδόν</title><desc id="d">Πλευρές x+3 και x+2 για x θετικό. Τέσσερα μέρη x², 3x, 2x, 6.</desc><rect width="600" height="300" rx="14" fill="white"/><g font-family="Arial,sans-serif" fill="#16324f" text-anchor="middle"><text x="300" y="28" font-size="20">Πλευρές x+3 και x+2, με x&gt;0</text><path d="M170 70h120v120H170z" fill="#dbeafe"/><path d="M290 70h90v120h-90z" fill="#e0e7ff"/><path d="M170 190h120v60H170z" fill="#ccfbf1"/><path d="M290 190h90v60h-90z" fill="#fef3c7"/><g stroke="#16324f" stroke-width="2" fill="none"><path d="M170 70H380V250H170Z M290 70V250 M170 190H380"/></g><g font-size="20"><text x="230" y="52">x</text><text x="335" y="52">3</text><text x="145" y="136">x</text><text x="145" y="227">2</text><text x="230" y="136">x²</text><text x="335" y="136">3x</text><text x="230" y="227">2x</text><text x="335" y="227">6</text></g><text x="300" y="282" font-size="14">Το συνολικό εμβαδόν είναι το άθροισμα των τεσσάρων μερών.</text></g></svg>
