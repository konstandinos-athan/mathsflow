<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc"><title id="title">Ιστόγραμμα ίσων κλάσεων</title><desc id="desc">Κλάσεις [0,10),[10,20),[20,30) με συχνότητες 2,3,5. Ίσο πλάτος κλάσεων και κοινή κλίμακα ύψους.</desc><rect width="600" height="220" fill="white"/><g fill="#93c5fd" stroke="#2563eb" stroke-width="2"><rect x="70" y="125" width="90" height="50"/><rect x="160" y="100" width="90" height="75"/><rect x="250" y="50" width="90" height="125"/></g><path d="M70 25 V175 H355" fill="none" stroke="#475569" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="17" fill="#172554"><text x="48" y="181">0</text><text x="65" y="200">0</text><text x="150" y="200">10</text><text x="240" y="200">20</text><text x="330" y="200">30</text><text x="48" y="131">2</text><text x="48" y="106">3</text><text x="48" y="56">5</text><text x="22" y="21">Πλήθος</text><text x="390" y="60">Συχνότητες: 2, 3, 5</text><text x="390" y="98">Σύνολο: 10</text><text x="390" y="136">Πλάτος κλάσης: 10</text><text x="390" y="174">Κάτω από 20: 50%</text></g></svg>
