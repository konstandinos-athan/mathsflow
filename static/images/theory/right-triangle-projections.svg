<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc"><title id="title">Μετρικές σχέσεις σε ορθογώνιο τρίγωνο</title><desc id="desc">ΑΒ=6, ΑΓ=8, ΒΓ=10, ΑΔ=4,8. Το Δ χωρίζει την υποτείνουσα σε ΒΔ=3,6 και ΔΓ=6,4.</desc><rect width="600" height="220" fill="white"/><g fill="none" stroke="#2563eb" stroke-width="3"><path d="M100 180 L208 36 L400 180 Z"/><path d="M208 36 V180" stroke="#dc2626" stroke-dasharray="6 4"/><path d="M202 44 l8 6 6-8"/><path d="M208 170 h10 v10"/></g><g font-family="Arial,sans-serif" font-size="17" fill="#172554"><text x="198" y="25">Α</text><text x="80" y="199">Β</text><text x="405" y="199">Γ</text><text x="203" y="201">Δ</text><text x="133" y="101">6</text><text x="312" y="101">8</text><text x="217" y="116" fill="#b91c1c">4,8</text><text x="133" y="201">3,6</text><text x="302" y="201">6,4</text><text x="450" y="78">6² + 8² = 10²</text><text x="450" y="111">4,8² = 3,6·6,4</text></g></svg>
