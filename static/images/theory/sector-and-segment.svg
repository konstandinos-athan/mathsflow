<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc"><title id="title">Τομέας 90 μοιρών και κυκλικό τμήμα</title><desc id="desc">Ακτίνα 4. Τομέας εμβαδού 4π, τρίγωνο εμβαδού 8 και μικρό κυκλικό τμήμα εμβαδού 4π−8.</desc><rect width="600" height="220" fill="white"/><path d="M80 180 L230 180 A150 150 0 0 0 80 30 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M230 180 A150 150 0 0 0 80 30 Z" fill="#a7f3d0" stroke="#059669" stroke-width="2"/><path d="M80 166 H94 V180" fill="none" stroke="#2563eb"/><g font-family="Arial,sans-serif" font-size="17" fill="#172554"><text x="58" y="199">Ο</text><text x="234" y="199">Α</text><text x="60" y="25">Β</text><text x="146" y="202">R = 4</text><text x="22" y="107">R = 4</text><text x="103" y="163">90°</text><text x="310" y="65">Τομέας: 4π cm²</text><text x="310" y="100">Τρίγωνο ΟΑΒ: 8 cm²</text><text x="310" y="135" fill="#047857">Κυκλικό τμήμα: (4π−8) cm²</text><text x="310" y="181">Το σχήμα αφορά μικρό τόξο 90°.</text></g></svg>
