<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
<title id="title">Πυθαγόρειο θεώρημα</title><desc id="desc">Κάθετες πλευρές μήκους 5 και 12, υποτείνουσα μήκους 13. Η ορθή γωνία σημειώνεται στο έδαφος.</desc>
<rect width="600" height="220" fill="#fff"/>
<path d="M220 180V36L280 180Z" fill="#eef4ff" stroke="#24558b" stroke-width="3"/>
<path d="M220 166H234V180" fill="none" stroke="#24558b" stroke-width="2"/>
<g font-family="Arial,sans-serif" font-size="19" fill="#142f52"><text x="175" y="115">12</text><text x="246" y="205">5</text><text x="275" y="110">13</text><text x="340" y="108">5² + 12² = 13²</text><text x="340" y="140">25 + 144 = 169</text></g>
</svg>
