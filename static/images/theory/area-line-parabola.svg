<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc"><title id="title">Εμβαδόν μεταξύ y=x και y=x²</title><desc id="desc">Στο διάστημα 0 έως 1 η ευθεία y=x βρίσκεται πάνω από την παραβολή y=x². Το εμβαδόν του χωρίου είναι 1/6 τετραγωνικής μονάδας.</desc><rect width="600" height="220" fill="white"/><path d="M65 185 L305 25 Q185 185 65 185 Z" fill="#dbeafe"/><path d="M65 15 V185 H335" fill="none" stroke="#475569" stroke-width="2"/><path d="M65 185 L305 25" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M65 185 Q185 185 305 25" fill="none" stroke="#dc2626" stroke-width="3"/><g font-family="Arial,sans-serif" font-size="17" fill="#172554"><text x="46" y="204">0</text><text x="302" y="206">1</text><text x="43" y="30">1</text><text x="338" y="191">x</text><text x="46" y="16">y</text><text x="370" y="55" fill="#1d4ed8">Πάνω: y = x</text><text x="370" y="88" fill="#b91c1c">Κάτω: y = x²</text><text x="370" y="130">Ε = 1/2 − 1/3 = 1/6</text><text x="370" y="175">Τομές: (0,0), (1,1)</text></g></svg>
