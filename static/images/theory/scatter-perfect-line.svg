<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc"><title id="title">Θετική γραμμική συσχέτιση</title><desc id="desc">Τα σημεία (1,3),(2,5),(3,7),(4,9) ανήκουν στην ευθεία y=2x+1. Το r ισούται με 1.</desc><rect width="600" height="220" fill="white"/><path d="M65 15 V185 H355" fill="none" stroke="#475569" stroke-width="2"/><path d="M65 170 L345 50" fill="none" stroke="#2563eb" stroke-width="2"/><g fill="#047857"><circle cx="135" cy="140" r="5"/><circle cx="205" cy="110" r="5"/><circle cx="275" cy="80" r="5"/><circle cx="345" cy="50" r="5"/></g><g font-family="Arial,sans-serif" font-size="16" fill="#172554"><text x="48" y="202">0</text><text x="131" y="204">1</text><text x="201" y="204">2</text><text x="271" y="204">3</text><text x="341" y="204">4</text><text x="41" y="145">3</text><text x="41" y="115">5</text><text x="41" y="85">7</text><text x="41" y="55">9</text><text x="360" y="190">x</text><text x="47" y="19">y</text><text x="390" y="58">y = 2x + 1</text><text x="390" y="89">r = 1</text><text x="390" y="137">Συσχέτιση ≠ αιτιότητα</text></g></svg>
